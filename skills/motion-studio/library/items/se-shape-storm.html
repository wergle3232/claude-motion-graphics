<!doctype html>
<!--
  se-shape-storm (claude-motion-graphics library)
  Job: a loud opening. Dozens of squares, circles and triangles pour in from above and the
  sides and pile up across the frame, then are sucked into the centre, and one big shape
  punches out of the point (the start of a morph, a logo or a diagram).
  From: the MORF "shapes" example (ex-shapes, the opening storm).
  Settings: count (shapes), final (square, circle or none), finalsize (px), length (seconds;
  the move fits it). Base 1.5 s: pour in 0 to 0.85 s, sucked in at 0.92 s, the shape at 1.2 s.
  Brand: shapes use the brand's text, accent and second accent colours (--brand-*).
-->
<html lang="en" data-composition-id="se-shape-storm" data-composition-variables='[
  {"id":"count","type":"number","label":"Shapes","default":40,"min":8,"max":120},
  {"id":"final","type":"string","label":"Shape at the end (square, circle or none)","default":"square"},
  {"id":"finalsize","type":"number","label":"Size of the shape at the end","default":360,"min":40,"max":1000,"unit":"px"},
  {"id":"length","type":"number","label":"Length","default":1.5,"min":0.5,"max":10,"step":0.05,"unit":"s"}
]'>
  <body>
    <template>
      <div id="root" data-composition-id="se-shape-storm">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; }
          .se-ss-cam { position: absolute; inset: 0; }
          .se-ss-bit, .se-ss-hero { position: absolute; left: 0; top: 0; }
          .se-ss-bit.ci, .se-ss-hero.ci { border-radius: 50%; }
          .se-ss-bit.tr { clip-path: polygon(50% 4%, 100% 92%, 0% 92%); }
        </style>
        <div class="se-ss-cam"></div>
        <script>
          (function () {
            "use strict";
            var ID = "se-shape-storm", BASE = 1.5, SUCK = 0.92, FORM = 1.2;
            var root = document.getElementById("root");
            var brand = function (n, d) { var x = getComputedStyle(root).getPropertyValue("--brand-" + n).trim(); return x || d; };
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var str = function (k, d) { return v[k] == null || v[k] === "" ? d : String(v[k]); };
            var num = function (k, d) { var n = Number(v[k]); return Number.isFinite(n) && n > 0 ? n : d; };
            var count = Math.round(num("count", 40)), final = str("final", "square"), FS = num("finalsize", 360), length = num("length", BASE);
            var seed = 0x5a9e3;
            function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

            function build() {
              var W = root.offsetWidth || 1920, H = root.offsetHeight || 1080, cam = root.querySelector(".se-ss-cam");
              var ink = brand("text", "#f5f5f5"), red = brand("accent", "#ff3d00"), grey = brand("accent-2", "#8e887e");
              var PAL = [ink, ink, red, red, grey], KINDS = ["sq", "ci", "tr"];
              var cols = Math.max(2, Math.round(Math.sqrt(count * W / H))), rows = Math.ceil(count / cols), unit = Math.min(W / cols, H / rows);
              var tl = gsap.timeline({ paused: true }), cx = W / 2, cy = H / 2;
              for (var n = 0; n < count; n++) {
                var c = n % cols, r = Math.floor(n / cols), sz = unit * (0.4 + rnd() * 0.5), kind = KINDS[Math.floor(rnd() * 3)];
                var e = document.createElement("div");
                e.className = "se-ss-bit " + kind;
                e.style.width = e.style.height = sz.toFixed(0) + "px";
                e.style.background = PAL[Math.floor(rnd() * PAL.length)];
                cam.appendChild(e);
                var x = (c + 0.5) * (W / cols) + (rnd() - 0.5) * unit * 0.5, y = (r + 0.5) * (H / rows) + (rnd() - 0.5) * unit * 0.4;
                var rot = (rnd() - 0.5) * 120, side = rnd() < 0.3 ? (rnd() < 0.5 ? -1 : 1) : 0, delay = n % 4 === 0 ? 0 : rnd() * 0.42;
                gsap.set(e, { xPercent: -50, yPercent: -50 });
                // Every fourth shape starts already in the frame and falling, so the first frame moves.
                var from = n % 4 === 0 ? { x: x, y: y - 260, rotation: rot - 120 } : side ? { x: side < 0 ? -250 : W + 250, y: y - 200, rotation: rot - 200 * side } : { x: x + (rnd() - 0.5) * 200, y: -250 - rnd() * 300, rotation: rot - 180 };
                tl.fromTo(e, from, { x: x, y: y, rotation: rot, duration: 0.42, ease: side ? "back.out(1.6)" : "bounce.out" }, delay);
                tl.to(e, { x: cx, y: cy, scale: 0, rotation: rot + 360, duration: 0.3, ease: "power3.in" }, SUCK + rnd() * 0.06);
              }
              if (final !== "none") {
                var h = document.createElement("div");
                h.className = "se-ss-hero" + (final === "circle" ? " ci" : "");
                h.style.width = h.style.height = FS + "px"; h.style.background = final === "circle" ? red : ink;
                cam.appendChild(h);
                gsap.set(h, { xPercent: -50, yPercent: -50, x: cx, y: cy, scale: 0 });
                tl.to(h, { scale: 1, duration: 0.22, ease: "back.out(2.6)" }, FORM);
                [[14, -10], [-12, 8], [8, -5], [-4, 2], [0, 0]].forEach(function (p, i) { tl.to(cam, { x: p[0], y: p[1], duration: 0.04, ease: "none" }, FORM + 0.05 + i * 0.04); });
              }
              tl.set({}, {}, BASE);
              return tl;
            }

            var ready = document.fonts ? document.fonts.ready : Promise.resolve();
            ready.then(function () {
              var inner = build();
              var tl = gsap.timeline({ paused: true });
              tl.to(inner, { time: BASE, duration: length, ease: "none" }, 0);
              window.__timelines = window.__timelines || {};
              window.__timelines[ID] = tl;
            });
          })();
        </script>
      </div>
    </template>
  </body>
</html>
