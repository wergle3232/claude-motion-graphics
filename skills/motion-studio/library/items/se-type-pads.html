<!doctype html>
<!--
  se-type-pads (claude-motion-graphics library)
  Job: shows doing something live or in rhythm. The line types in above a row of
  pads that light up one after another, and the last word flashes in the accent.
  From: an early test piece, "Perform it." (built by hand).
  Settings: text, size (px), pads (how many), accent, length (seconds). Base 0.73 s.
  Brand: empty colour settings take the piece's brand.css (--brand-*); fonts too.
-->
<html lang="en" data-composition-id="se-type-pads" data-composition-variables='[
  {"id":"text","type":"string","label":"Text","default":"Perform it."},
  {"id":"size","type":"number","label":"Text size","default":168,"min":40,"max":400,"unit":"px"},
  {"id":"pads","type":"number","label":"Pads","default":5,"min":2,"max":12},
  {"id":"accent","type":"color","label":"Accent (empty: brand)","default":""},
  {"id":"length","type":"number","label":"Length","default":0.73,"min":0.2,"max":10,"step":0.05,"unit":"s"}
]'>
  <body>
    <template>
      <div id="root" data-composition-id="se-type-pads">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; }
          .se-pads-word { position: absolute; left: 0; top: 0; font-family: var(--brand-font-display, "Inter"), sans-serif; color: var(--brand-text, #f5f5f5); font-weight: 600; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
          .se-pads-word span { display: inline-block; white-space: pre; }
          .se-pads-row { position: absolute; left: 0; top: 0; display: flex; gap: 20px; }
          .se-pads-row i { display: block; width: 168px; height: 168px; border-radius: 20px; background: var(--brand-surface, #24242c); }
        </style>
        <div class="se-pads-word"></div>
        <div class="se-pads-row"></div>
        <script>
          (function () {
            "use strict";
            var ID = "se-type-pads", BASE = 0.73;
            // HyperFrames runs this with a document scoped to this copy, so "root" is this copy's root.
            var root = document.getElementById("root");
            // Brand: colours and fonts come from the piece's brand.css (--brand-*). A setting passed in wins.
            var brand = function (n, d) { var x = getComputedStyle(root).getPropertyValue("--brand-" + n).trim(); return x || d; };
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var str = function (k, d) { return v[k] == null || v[k] === "" ? d : String(v[k]); };
            var num = function (k, d) { var n = Number(v[k]); return Number.isFinite(n) && n > 0 ? n : d; };
            var text = str("text", "Perform it."), size = num("size", 168), count = Math.round(num("pads", 5)), accent = str("accent", brand("accent", "#00e87b")), length = num("length", BASE);

            function build() {
              var W = root.offsetWidth || 1920, H = root.offsetHeight || 1080;
              var word = root.querySelector(".se-pads-word"), row = root.querySelector(".se-pads-row");
              word.style.fontSize = size + "px";
              var chars = Array.from(text).map(function (c) { var s = document.createElement("span"); s.textContent = c; word.appendChild(s); return s; });
              var pads = [];
              for (var p = 0; p < count; p++) { var pad = document.createElement("i"); pad.style.width = pad.style.height = size + "px"; pad.style.borderRadius = size * 0.12 + "px"; row.appendChild(pad); pads.push(pad); }
              row.style.gap = size * 0.12 + "px";
              var gap = size * 0.3, total = word.offsetHeight + gap + row.offsetHeight, top = H / 2 - total / 2;
              gsap.set(word, { x: W / 2 - word.offsetWidth / 2, y: top });
              var rowY = top + word.offsetHeight + gap;
              gsap.set(row, { x: W / 2 - row.offsetWidth / 2, y: rowY });
              var tl = gsap.timeline({ paused: true });
              gsap.set(chars, { opacity: 0 });
              // The last word types a beat later and flashes in the accent.
              var lastSpace = text.trimEnd().lastIndexOf(" ");
              var split = lastSpace > 0 ? lastSpace + 1 : chars.length;
              chars.forEach(function (c, i) { tl.set(c, { opacity: 1 }, i < split ? i * 0.02 : 0.22 + (i - split) * 0.025); });
              tl.fromTo(chars.slice(split), { color: accent, textShadow: "0 0 18px " + accent }, { color: brand("text", "#f5f5f5"), textShadow: "0 0 0px rgba(0,0,0,0)", duration: 0.2, immediateRender: false }, 0.47);
              tl.fromTo(row, { y: rowY + size * 0.5, opacity: 0 }, { y: rowY, opacity: 1, duration: 0.15, ease: "power3.out" }, 0);
              // Pads light in a loose order, one after another.
              var order = [3, 1, 4, 0, 2, 5, 7, 6, 9, 8, 11, 10];
              var hits = order.filter(function (i) { return i < count; });
              hits.forEach(function (i, n) {
                tl.fromTo(pads[i], { backgroundColor: accent, boxShadow: "0 0 30px " + accent }, { backgroundColor: brand("surface", "#24242c"), boxShadow: "0 0 0px rgba(0,0,0,0)", duration: 0.18, ease: "power1.out", immediateRender: false }, 0.11 + (n * 0.46) / Math.max(1, hits.length - 1));
              });
              tl.to(row, { y: rowY + size * 0.5, opacity: 0, duration: 0.12, ease: "power2.in" }, 0.58);
              tl.set({}, {}, BASE);
              return tl;
            }

            var fonts = document.fonts ? document.fonts.ready : Promise.resolve();
            fonts.then(function () {
              var inner = build();
              var tl = gsap.timeline({ paused: true });
              tl.to(inner, { time: BASE, duration: length, ease: "none" }, 0);
              window.__timelines = window.__timelines || {};
              window.__timelines[ID] = tl;
            });
          })();
        </script>
      </div>
    </template>
  </body>
</html>
