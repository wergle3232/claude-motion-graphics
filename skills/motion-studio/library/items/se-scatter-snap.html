<!doctype html>
<!--
  se-scatter-snap (claude-motion-graphics library)
  Job: shows something getting organised or lined up. The letters start scattered
  at different sizes and angles and snap into line, then alignment guides flash.
  From: an early test piece, "Move it." (built by hand; HyperFrames' char-slam-explode
  does the same with its timing fixed, see library.md).
  Settings: text, size (px), guides (on or off), length (seconds). Base 0.64 s.
  Brand: empty colour settings take the piece's brand.css (--brand-*); fonts too.
-->
<html lang="en" data-composition-id="se-scatter-snap" data-composition-variables='[
  {"id":"text","type":"string","label":"Text","default":"Move it."},
  {"id":"size","type":"number","label":"Text size","default":185,"min":40,"max":400,"unit":"px"},
  {"id":"guides","type":"boolean","label":"Alignment guides","default":true},
  {"id":"length","type":"number","label":"Length","default":0.64,"min":0.2,"max":10,"step":0.05,"unit":"s"}
]'>
  <body>
    <template>
      <div id="root" data-composition-id="se-scatter-snap">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; }
          .se-snap-word { position: absolute; left: 0; top: 0; font-family: var(--brand-font-display, "Inter"), sans-serif; color: var(--brand-text, #f5f5f5); font-weight: 600; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
          .se-snap-word span { display: inline-block; white-space: pre; }
          .se-snap-guide { position: absolute; background: rgba(245, 245, 245, 0.6); opacity: 0; }
        </style>
        <div class="se-snap-word"></div>
        <div class="se-snap-guide se-snap-v"></div>
        <div class="se-snap-guide se-snap-h"></div>
        <script>
          (function () {
            "use strict";
            var ID = "se-scatter-snap", BASE = 0.64;
            // HyperFrames runs this with a document scoped to this copy, so "root" is this copy's root.
            var root = document.getElementById("root");
            // Brand: colours and fonts come from the piece's brand.css (--brand-*). A setting passed in wins.
            var brand = function (n, d) { var x = getComputedStyle(root).getPropertyValue("--brand-" + n).trim(); return x || d; };
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var str = function (k, d) { return v[k] == null || v[k] === "" ? d : String(v[k]); };
            var num = function (k, d) { var n = Number(v[k]); return Number.isFinite(n) && n > 0 ? n : d; };
            var text = str("text", "Move it."), size = num("size", 185), guides = v.guides !== false, length = num("length", BASE);
            // Fixed-seed random numbers, so every render is the same.
            var seed = 0x5ec0de;
            var rnd = function () { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

            function build() {
              var W = root.offsetWidth || 1920, H = root.offsetHeight || 1080;
              var word = root.querySelector(".se-snap-word");
              word.style.fontSize = size + "px";
              var chars = Array.from(text).map(function (c) { var s = document.createElement("span"); s.textContent = c; word.appendChild(s); return s; });
              gsap.set(word, { x: W / 2 - word.offsetWidth / 2, y: H / 2 - word.offsetHeight / 2 });
              var k = size / 185;
              var tl = gsap.timeline({ paused: true });
              chars.forEach(function (c, i) {
                var fx = (rnd() - 0.5) * 220 * k, fy = (rnd() - 0.5) * 120 * k, fs = 0.6 + rnd() * 0.9, fr = (rnd() - 0.5) * 50, sk = rnd() < 0.3 ? -14 : 0;
                tl.fromTo(c, { x: fx, y: fy, scale: fs, rotation: fr, skewX: sk }, { x: 0, y: 0, scale: 1, rotation: 0, skewX: 0, duration: 0.28, ease: "back.out(2.2)", immediateRender: true }, 0.04 + i * 0.02);
              });
              if (guides) {
                var gv = root.querySelector(".se-snap-v"), gh = root.querySelector(".se-snap-h");
                gsap.set(gv, { left: W / 2 - 0.5, top: 0, width: 1, height: H });
                gsap.set(gh, { left: 0, top: H / 2 - 0.5, width: W, height: 1 });
                tl.fromTo(gv, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.1, ease: "power2.out" }, 0.42);
                tl.fromTo(gh, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.1, ease: "power2.out" }, 0.52);
              }
              tl.set({}, {}, BASE);
              return tl;
            }

            var fonts = document.fonts ? document.fonts.ready : Promise.resolve();
            fonts.then(function () {
              var inner = build();
              var tl = gsap.timeline({ paused: true });
              tl.to(inner, { time: BASE, duration: length, ease: "none" }, 0);
              window.__timelines = window.__timelines || {};
              window.__timelines[ID] = tl;
            });
          })();
        </script>
      </div>
    </template>
  </body>
</html>
