<!doctype html>
<!--
  se-physics-bounce (claude-motion-graphics library)
  Job: something dropping and landing with weight (a product, a logo mark, a ball; "it
  lands", "it's simple", "more than you think"). A ball drops in from above, speeds up as
  it falls, stretches when it is fast, squashes on each landing, bounces lower each time,
  and rolls to a stop; its shadow grows and darkens as it comes down. Optional grey ghost
  copies at equal time steps (an animator's spacing chart).
  From: the MORF ball reel (ex-ball), whose full version adds a slow-motion replay with
  callout labels (see examples/ex-ball).
  How: the bounce is a small physics model (gravity, a share of speed kept on each bounce,
  squash and stretch from speed), and every frame is worked out from the time. That keeps
  it right when slowed down or replayed: a longer length is real slow motion.
  Settings: size (ball diameter, px), keep (share of speed kept per bounce, 0.5 to 0.85),
  travel (sideways distance as a share of the width), ghosts (yes or no), shadow (yes or no),
  colour (empty = brand accent), length (seconds; the whole move scales to fit, so longer
  is slower). Base 4.1 s.
  Brand: empty colour settings take the piece's brand.css (--brand-*).
-->
<html lang="en" data-composition-id="se-physics-bounce" data-composition-variables='[
  {"id":"size","type":"number","label":"Ball size","default":150,"min":20,"max":600,"unit":"px"},
  {"id":"keep","type":"number","label":"Speed kept per bounce","default":0.7,"min":0.5,"max":0.85,"step":0.05},
  {"id":"travel","type":"number","label":"Sideways travel (share of width)","default":0.5,"min":0,"max":0.8,"step":0.05},
  {"id":"ghosts","type":"string","label":"Ghost copies (yes or no)","default":"no"},
  {"id":"shadow","type":"string","label":"Shadow (yes or no)","default":"yes"},
  {"id":"colour","type":"string","label":"Ball colour (empty: brand accent)","default":""},
  {"id":"length","type":"number","label":"Length","default":4.1,"min":0.5,"max":30,"step":0.05,"unit":"s"}
]'>
  <body>
    <template>
      <div id="root" data-composition-id="se-physics-bounce">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; }
          .se-pb-ball, .se-pb-ghost { position: absolute; left: 0; top: 0; border-radius: 50%; transform-origin: 50% 100%; }
          .se-pb-ghost { box-sizing: border-box; }
          .se-pb-shadow { position: absolute; left: 0; top: 0; border-radius: 50%; transform-origin: 50% 50%; }
        </style>
        <div class="se-pb-shadow"></div><div class="se-pb-ghosts"></div><div class="se-pb-ball"></div>
        <script>
          (function () {
            "use strict";
            var ID = "se-physics-bounce";
            var root = document.getElementById("root");
            var brand = function (n, d) { var x = getComputedStyle(root).getPropertyValue("--brand-" + n).trim(); return x || d; };
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var str = function (k, d) { return v[k] == null || v[k] === "" ? d : String(v[k]); };
            var num = function (k, d) { var n = Number(v[k]); return Number.isFinite(n) && n >= 0 && v[k] !== "" && v[k] != null ? n : d; };
            var D = num("size", 150) || 150, R = D / 2, E = Math.min(0.85, Math.max(0.5, num("keep", 0.7))), TRAVEL = num("travel", 0.5);
            var GHOSTS = str("ghosts", "no") === "yes", SHADOW = str("shadow", "yes") !== "no", COL = str("colour", brand("accent", "#ff3d00"));

            // The model. Times do not depend on the box size: the first drop always takes FALL s.
            var FALL = 0.6, STOP = 0.105, ROLL = 0.4, STRETCH = 0.25, SQUASH = 0.42, DWELL = 0.07;
            var segs = [{ type: "fall", t0: 0, dur: FALL }], contacts = [], t = FALL, vin = 1;
            while (true) {
              var vout = E * vin, d = DWELL * Math.sqrt(vin);
              segs.push({ type: "contact", t0: t, dur: d, vin: vin, vout: vout }); contacts.push(t); t += d;
              if (vout < STOP) break;
              var air = 2 * vout * FALL; // in units where the first landing speed is 1
              segs.push({ type: "air", t0: t, dur: air, vu: vout }); t += air; vin = vout;
            }
            var REST = t, END = REST + ROLL, BASE = END + 0.3, length = num("length", 4.1) || 4.1;

            function build() {
              var W = root.offsetWidth || 1920, H = root.offsetHeight || 1080;
              var G = H * 0.8, H0 = G + R * 1.2, g = 2 * H0 / (FALL * FALL), V1 = g * FALL; // drop from just above the box
              var X0 = W * (0.5 - TRAVEL / 2), VX = (W * TRAVEL) / (REST + ROLL / 2);
              function xAt(s) { if (s <= REST) return X0 + VX * s; var tau = Math.min(s - REST, ROLL); return X0 + VX * REST + VX * tau - 0.5 * (VX / ROLL) * tau * tau; }
              function at(s) {
                var x = xAt(s);
                for (var i = 0; i < segs.length; i++) {
                  var sg = segs[i], tau = s - sg.t0;
                  if (tau < 0 || tau >= sg.dur) continue;
                  if (sg.type !== "contact") {
                    var vu = sg.type === "fall" ? 0 : sg.vu * V1;
                    var hgt = sg.type === "fall" ? H0 - 0.5 * g * tau * tau : vu * tau - 0.5 * g * tau * tau;
                    var vy = sg.type === "fall" ? g * tau : vu - g * tau, st = STRETCH * Math.pow(Math.abs(vy) / V1, 2);
                    return { x: x, b: G - Math.max(0, hgt), sx: 1 - 0.45 * st, sy: 1 + st, h: Math.max(0, hgt) };
                  }
                  var u = tau / sg.dur, sq = SQUASH * sg.vin * Math.sin(Math.PI * u);
                  var pre = STRETCH * sg.vin * sg.vin * Math.max(0, 1 - u / 0.25), post = sg.vout < STOP ? 0 : STRETCH * sg.vout * sg.vout * Math.max(0, (u - 0.75) / 0.25);
                  return { x: x, b: G, sx: 1 + 0.9 * sq - 0.45 * (pre + post), sy: 1 - sq + pre + post, h: 0 };
                }
                return { x: x, b: G, sx: 1, sy: 1, h: 0 };
              }
              var ball = root.querySelector(".se-pb-ball"), shadow = root.querySelector(".se-pb-shadow"), gl = root.querySelector(".se-pb-ghosts");
              ball.style.cssText += "width:" + D + "px;height:" + D + "px;background:" + COL;
              shadow.style.cssText += "width:" + (D * 1.13) + "px;height:" + (D * 0.23) + "px;background:" + brand("accent-2", "#8e887e") + ";display:" + (SHADOW ? "block" : "none");
              var ghosts = [];
              if (GHOSTS) for (var s = 1 / 12; s < (contacts[2] || REST); s += 1 / 12) {
                var q = at(s);
                if (q.b - D * q.sy < 0) continue;
                var gh = document.createElement("div"); gh.className = "se-pb-ghost";
                gh.style.cssText = "width:" + D + "px;height:" + D + "px;border:" + Math.max(2, D / 38) + "px solid " + brand("accent-2", "#8e887e") + ";opacity:0;transform:translate(" + (q.x - R) + "px," + (q.b - D) + "px) scale(" + q.sx + "," + q.sy + ")";
                gl.appendChild(gh); ghosts.push({ el: gh, s: s });
              }
              function render(s) {
                var q = at(s);
                ball.style.transform = "translate(" + (q.x - R) + "px," + (q.b - D) + "px) scale(" + q.sx + "," + q.sy + ")";
                var k = Math.min(1, q.h / (H * 0.7));
                shadow.style.transform = "translate(" + (q.x - D * 0.565) + "px," + (G - D * 0.115) + "px) scale(" + (1.1 - 0.72 * k) + ")";
                shadow.style.opacity = (0.95 * (1 - k)).toFixed(3);
                for (var i = 0; i < ghosts.length; i++) ghosts[i].el.style.opacity = s >= ghosts[i].s ? 1 : 0;
              }
              var tl = gsap.timeline({ paused: true }), clock = { s: 0 };
              tl.fromTo(clock, { s: 0 }, { s: END, duration: END, ease: "none", onUpdate: function () { render(clock.s); } }, 0);
              tl.set({}, {}, BASE);
              render(0);
              return tl;
            }

            var ready = document.fonts ? document.fonts.ready : Promise.resolve();
            ready.then(function () {
              var inner = build();
              var tl = gsap.timeline({ paused: true });
              tl.to(inner, { time: BASE, duration: length, ease: "none" }, 0);
              window.__timelines = window.__timelines || {};
              window.__timelines[ID] = tl;
            });
          })();
        </script>
      </div>
    </template>
  </body>
</html>
