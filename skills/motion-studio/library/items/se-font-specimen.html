<!doctype html>
<!--
  se-font-specimen (claude-motion-graphics library)
  Job: showing type or a font choice. "Aa" on a brand-coloured disc swaps through fonts,
  each one named underneath, and settles in the brand's headline font.
  From: the MORF "moving titles" example (ex-titles, the specimen beside "graphics").
  Pairs with se-font-decode (a word that scrambles through fonts) when both are on screen.
  Settings: sample (the letters shown), size (disc diameter, px), fonts (comma list; common
  system fonts by default, so what shows depends on the computer that renders), final (the
  name shown at the end; empty = the brand's headline font), disc (colour; empty = brand
  accent), length (seconds; the move fits it). Base 1.1 s.
  Brand: empty colour settings take the piece's brand.css (--brand-*); fonts too.
-->
<html lang="en" data-composition-id="se-font-specimen" data-composition-variables='[
  {"id":"sample","type":"string","label":"Letters","default":"Aa"},
  {"id":"size","type":"number","label":"Disc size","default":440,"min":120,"max":1000,"unit":"px"},
  {"id":"fonts","type":"string","label":"Fonts to swap through (comma list)","default":"Georgia,Impact,Segoe Script,Arial Black,Times New Roman,Courier New,Trebuchet MS,Palatino Linotype,Comic Sans MS,Consolas"},
  {"id":"final","type":"string","label":"Name at the end (empty: brand headline font)","default":""},
  {"id":"disc","type":"string","label":"Disc colour (empty: brand accent)","default":""},
  {"id":"length","type":"number","label":"Length","default":1.1,"min":0.3,"max":10,"step":0.05,"unit":"s"}
]'>
  <body>
    <template>
      <div id="root" data-composition-id="se-font-specimen">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; }
          .se-fs-disc { position: absolute; left: 0; top: 0; border-radius: 50%; }
          .se-fs-aa { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; font-family: var(--brand-font-display, "Inter"), sans-serif; color: var(--brand-text, #f5f5f5); line-height: 1; letter-spacing: -0.03em; white-space: nowrap; }
          .se-fs-name { position: absolute; left: 0; top: 0; font-family: var(--brand-font-mono, "Inter"), monospace; font-weight: 500; color: var(--brand-muted, #8a8a8a); line-height: 1; white-space: nowrap; text-align: center; }
        </style>
        <div class="se-fs-disc"></div><div class="se-fs-aa"></div><div class="se-fs-name"></div>
        <script>
          (function () {
            "use strict";
            var ID = "se-font-specimen", BASE = 1.1, STEP = 0.06;
            var root = document.getElementById("root");
            var brand = function (n, d) { var x = getComputedStyle(root).getPropertyValue("--brand-" + n).trim(); return x || d; };
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var str = function (k, d) { return v[k] == null || v[k] === "" ? d : String(v[k]); };
            var num = function (k, d) { var n = Number(v[k]); return Number.isFinite(n) && n > 0 ? n : d; };
            var display = brand("font-display", "Inter").replace(/^["']|["']$/g, "");
            var sample = str("sample", "Aa"), D = num("size", 440), length = num("length", BASE);
            var fonts = str("fonts", "Georgia,Impact,Segoe Script,Arial Black,Times New Roman,Courier New,Trebuchet MS,Palatino Linotype,Comic Sans MS,Consolas").split(",").map(function (f) { return f.trim(); }).filter(Boolean);
            var finalName = str("final", display), discCol = str("disc", brand("accent", "#ff3d00"));

            function build() {
              var W = root.offsetWidth || 1920, H = root.offsetHeight || 1080;
              var disc = root.querySelector(".se-fs-disc"), aa = root.querySelector(".se-fs-aa"), name = root.querySelector(".se-fs-name");
              var cx = W / 2, cy = H / 2 - D * 0.08, fs = Math.max(36, Math.round(D * 0.145));
              disc.style.cssText += "width:" + D + "px;height:" + D + "px;background:" + discCol;
              aa.style.cssText += "width:" + D + "px;height:" + D + "px;font-size:" + Math.round(D * 0.52) + "px";
              aa.textContent = sample;
              name.style.fontSize = fs + "px"; name.style.width = W + "px";
              gsap.set([disc, aa], { x: cx - D / 2, y: cy - D / 2 });
              gsap.set(name, { x: 0, y: cy + D / 2 + fs * 0.6 });
              var tl = gsap.timeline({ paused: true });
              tl.fromTo(disc, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 0);
              tl.fromTo(aa, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 0.08);
              tl.fromTo(name, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.08);
              var end = 0.08 + 0.66;
              for (var k = 0, t = 0.08; t < end; t += STEP, k++) {
                var f = fonts[k % fonts.length];
                tl.set(aa, { fontFamily: '"' + f + '", serif' }, t);
                tl.set(name, { textContent: f }, t);
              }
              tl.set(aa, { fontFamily: '"' + display + '", sans-serif' }, end);
              tl.set(name, { textContent: finalName, color: brand("text", "#f5f5f5") }, end);
              tl.fromTo(disc, { scale: 1.1 }, { scale: 1, immediateRender: false, duration: 0.3, ease: "power3.out" }, end);
              tl.fromTo(aa, { scale: 1.12 }, { scale: 1, immediateRender: false, duration: 0.3, ease: "power3.out" }, end);
              tl.set({}, {}, BASE);
              return tl;
            }

            var ready = document.fonts ? document.fonts.ready : Promise.resolve();
            ready.then(function () {
              var inner = build();
              var tl = gsap.timeline({ paused: true });
              tl.to(inner, { time: BASE, duration: length, ease: "none" }, 0);
              window.__timelines = window.__timelines || {};
              window.__timelines[ID] = tl;
            });
          })();
        </script>
      </div>
    </template>
  </body>
</html>
