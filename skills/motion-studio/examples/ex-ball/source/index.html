<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[{"id":"mode","type":"string","label":"Mode: final or overlay (see-through, ball and shadow only)","default":"final"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="shared/brand.css" />
    <link rel="stylesheet" href="shared/piece.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="shared/sim.js"></script>
    <script src="shared/piece.js"></script>
    <style>
      html, body { width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.7" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="12.7" data-track-index="0">
        <div id="topline"></div>
        <div id="eyeA" class="eyebrow"></div>
        <div id="eyeB" class="eyebrow"></div>
        <div id="floor"></div>
        <div id="rule"></div>
        <div id="shadow"></div>
        <div id="ghosts" data-layout-ignore></div>
        <div id="ticks" data-layout-ignore></div>
        <svg id="ink" viewBox="0 0 1920 1080" data-layout-ignore></svg>
        <div id="ball"></div>
        <div id="labels" data-layout-ignore></div>
      </div>
      <!-- A thud on each landing, quieter each time. Times are the landings in shared/sim.js. -->
      <audio id="s-r1" src="assets/sfx/thud.mp3" data-start="0.6" data-duration="0.55" data-track-index="10" data-volume="0.9"></audio>
      <audio id="s-r2" src="assets/sfx/thud.mp3" data-start="1.51" data-duration="0.55" data-track-index="11" data-volume="0.68"></audio>
      <audio id="s-r3" src="assets/sfx/thud.mp3" data-start="2.157" data-duration="0.55" data-track-index="12" data-volume="0.5"></audio>
      <audio id="s-r4" src="assets/sfx/thud.mp3" data-start="2.617" data-duration="0.55" data-track-index="13" data-volume="0.38"></audio>
      <audio id="s-r5" src="assets/sfx/thud.mp3" data-start="2.946" data-duration="0.55" data-track-index="14" data-volume="0.29"></audio>
      <!-- Slow motion: the first landing is a long, deep thud; the rest are back near real time. -->
      <audio id="s-s1" src="assets/sfx/thud-slow.mp3" data-start="6.376" data-duration="1.5" data-track-index="15" data-volume="0.95"></audio>
      <audio id="s-s2" src="assets/sfx/thud.mp3" data-start="8.203" data-duration="0.55" data-track-index="16" data-volume="0.68"></audio>
      <audio id="s-s3" src="assets/sfx/thud.mp3" data-start="8.994" data-duration="0.55" data-track-index="17" data-volume="0.5"></audio>
      <audio id="s-s4" src="assets/sfx/thud.mp3" data-start="9.493" data-duration="0.55" data-track-index="18" data-volume="0.38"></audio>
      <audio id="s-s5" src="assets/sfx/thud.mp3" data-start="9.822" data-duration="0.55" data-track-index="19" data-volume="0.29"></audio>
    </div>
    <script>
      document.fonts.ready.then(function () { window.__timelines["main"] = window.buildPieceTimeline(); });
    </script>
  </body>
</html>
