<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[{"id":"mode","type":"string","label":"Mode: final or storyboard","default":"final"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="shared/brand.css" />
    <link rel="stylesheet" href="shared/piece.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="shared/piece.js"></script>
    <style>
      html, body { width: 1920px; height: 1080px; }
      /* 16:9 layout. Safe zone 96 px; bottom-right 400 x 220 kept clear. */
      #root { --x0: 150px; --top-y: 96px; --eyebrow-y: 140px; --title-y: 262px; --title-size: 215px; --bar-y: 690px; --bar-w: 1000px; --sub-y: 760px; --sub-size: 92px; --bot-y: 948px; --spec-r: 110px; --spec-y: 250px; --disc: 440px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="cam">
          <div id="topline"></div>
          <div id="botline"></div>
          <div id="eyebrow"></div>
          <div id="disc"></div>
          <div id="spec" data-layout-allow-overlap>Aa</div>
          <div id="spec-label">Archivo Black</div>
          <div id="main-title"></div>
          <div id="ghosts" data-layout-ignore></div>
          <div id="bands" data-layout-ignore></div>
          <div id="underbar"></div>
          <div id="sub"><span class="lead"></span><span id="tag"><span class="blk"></span><span class="t">Claude Code</span></span></div>
          <div id="caret"></div>
        </div>
        <div id="flash"></div>
      </div>
      <audio id="s-impact" src="assets/sfx/impact-bass-1.mp3" data-start="0.23" data-duration="2.12" data-track-index="10" data-volume="1"></audio>
      <audio id="s-whoosh" src="assets/sfx/whoosh-short.mp3" data-start="0.42" data-duration="0.57" data-track-index="11" data-volume="0.6"></audio>
      <audio id="s-typing" src="assets/sfx/typing.mp3" data-start="1.1" data-duration="0.8" data-track-index="12" data-volume="0.7"></audio>
      <audio id="s-glitch" src="assets/sfx/glitch-1.mp3" data-start="1.9" data-duration="0.7" data-track-index="13" data-volume="0.75"></audio>
      <audio id="s-click" src="assets/sfx/click-soft.mp3" data-start="2.3" data-duration="0.37" data-track-index="14" data-volume="0.8"></audio>
      <audio id="s-pop" src="assets/sfx/pop.mp3" data-start="2.72" data-duration="0.72" data-track-index="15" data-volume="0.9"></audio>
      <audio id="s-bar" src="assets/sfx/click.mp3" data-start="3.2" data-duration="0.37" data-track-index="16" data-volume="0.9"></audio>
    </div>
    <script>
      document.fonts.ready.then(function () { window.__timelines["main"] = window.buildPieceTimeline(); });
    </script>
  </body>
</html>
