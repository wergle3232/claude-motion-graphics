<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[{"id":"mode","type":"string","label":"Mode: final or storyboard","default":"final"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="shared/brand.css" />
    <link rel="stylesheet" href="shared/piece.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="shared/piece.js"></script>
    <style>
      html, body { width: 1920px; height: 1080px; }
      /* 16:9 layout: node centres and the line the diagram sits on. Safe zone 96 px. */
      #root { --row-y: 500; --lab-y: 690; --xl: 330; --xm: 960; --xr: 1590; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="7" data-track-index="0">
        <div id="cam">
          <div id="storm" data-layout-ignore></div>
          <div id="topline"></div>
          <div id="botline"></div>
          <div id="eyebrow"></div>
          <div id="l1" class="line"></div><div id="h1" class="head"></div>
          <div id="l2" class="line"></div><div id="h2" class="head"></div>
          <div id="p1" class="pulse"></div><div id="p2" class="pulse"></div>
          <div id="ring" class="shape"></div>
          <div id="nodeL" class="shape"></div>
          <div id="nodeR" class="shape"></div>
          <div id="mk" class="shape"></div>
          <div id="hero" class="shape"></div>
          <div id="labL" class="label">Idea</div>
          <div id="labM" class="label">MORF</div>
          <div id="labR" class="label">Motion</div>
        </div>
      </div>
      <audio id="s-storm" src="assets/sfx/whoosh.mp3" data-start="0.0" data-duration="1.2" data-track-index="10" data-volume="0.6"></audio>
      <audio id="s-pop1" src="assets/sfx/pop.mp3" data-start="0.3" data-duration="0.72" data-track-index="11" data-volume="0.7"></audio>
      <audio id="s-pop2" src="assets/sfx/pop.mp3" data-start="0.55" data-duration="0.72" data-track-index="12" data-volume="0.7"></audio>
      <audio id="s-suck" src="assets/sfx/whoosh-short.mp3" data-start="0.92" data-duration="0.57" data-track-index="13" data-volume="0.9"></audio>
      <audio id="s-form" src="assets/sfx/impact-bass-1.mp3" data-start="1.2" data-duration="2.0" data-track-index="14" data-volume="1"></audio>
      <audio id="s-m1" src="assets/sfx/click.mp3" data-start="1.5" data-duration="0.37" data-track-index="15" data-volume="0.9"></audio>
      <audio id="s-m2" src="assets/sfx/key-press.mp3" data-start="1.8" data-duration="0.4" data-track-index="16" data-volume="0.9"></audio>
      <audio id="s-m3" src="assets/sfx/click.mp3" data-start="2.1" data-duration="0.37" data-track-index="17" data-volume="0.9"></audio>
      <audio id="s-m4" src="assets/sfx/key-press.mp3" data-start="2.4" data-duration="0.4" data-track-index="18" data-volume="0.9"></audio>
      <audio id="s-dive" src="assets/sfx/whoosh-short.mp3" data-start="2.85" data-duration="0.57" data-track-index="19" data-volume="1"></audio>
      <audio id="s-red" src="assets/sfx/impact-bass-1.mp3" data-start="3.2" data-duration="2.0" data-track-index="20" data-volume="0.8"></audio>
      <audio id="s-lock" src="assets/sfx/click.mp3" data-start="4.05" data-duration="0.37" data-track-index="21" data-volume="1"></audio>
      <audio id="s-tick1" src="assets/sfx/click-soft.mp3" data-start="4.22" data-duration="0.37" data-track-index="22" data-volume="0.8"></audio>
      <audio id="s-tick2" src="assets/sfx/click-soft.mp3" data-start="4.42" data-duration="0.37" data-track-index="23" data-volume="0.8"></audio>
      <audio id="s-ping" src="assets/sfx/ping.mp3" data-start="5.0" data-duration="1.32" data-track-index="24" data-volume="0.6"></audio>
    </div>
    <script>
      document.fonts.ready.then(function () { window.__timelines["main"] = window.buildPieceTimeline(); });
    </script>
  </body>
</html>
