<!doctype html>
<!--
  se-flip (StackEngine library)
  Job: shows something repeating or looping. The first word flips round to show
  its back and comes back, the rest of the line types in after it, twice.
  From: Apple test 1, shot 7 "Loop it." (built by hand: a 3D flip played twice).
  Settings: word, rest, size (px), length (seconds; the move fits it). Base 0.78 s.
-->
<html lang="en" data-composition-id="se-flip" data-composition-variables='[
  {"id":"word","type":"string","label":"Word that flips","default":"Loop"},
  {"id":"rest","type":"string","label":"Rest of the line","default":" it."},
  {"id":"size","type":"number","label":"Text size","default":176,"min":40,"max":400,"unit":"px"},
  {"id":"length","type":"number","label":"Length","default":0.78,"min":0.2,"max":10,"step":0.05,"unit":"s"}
]'>
  <body>
    <template>
      <div id="root" data-composition-id="se-flip" data-width="1920" data-height="1080">
        <style>
          #root { position: absolute; inset: 0; overflow: hidden; }
          .se-flip-line { position: absolute; left: 0; top: 0; perspective: 900px; font-family: "Inter", sans-serif; color: #f5f5f5; font-weight: 600; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
          .se-flip-word { display: inline-block; transform-origin: 50% 50%; }
          .se-flip-rest span { display: inline-block; white-space: pre; }
        </style>
        <div class="se-flip-line"><span class="se-flip-word"></span><span class="se-flip-rest"></span></div>
        <script>
          (function () {
            "use strict";
            var ID = "se-flip", BASE = 0.78;
            // HyperFrames runs this with a document scoped to this copy, so "root" is this copy's root.
            var root = document.getElementById("root");
            var v = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
            var str = function (k, d) { return v[k] == null || v[k] === "" ? d : String(v[k]); };
            var num = function (k, d) { var n = Number(v[k]); return Number.isFinite(n) && n > 0 ? n : d; };
            var word = str("word", "Loop"), rest = v.rest == null ? " it." : String(v.rest), size = num("size", 176), length = num("length", BASE);

            function build() {
              var W = root.offsetWidth || 1920, H = root.offsetHeight || 1080;
              var line = root.querySelector(".se-flip-line"), flip = root.querySelector(".se-flip-word"), restEl = root.querySelector(".se-flip-rest");
              line.style.fontSize = size + "px";
              flip.textContent = word;
              var chars = Array.from(rest).map(function (c) { var s = document.createElement("span"); s.textContent = c; restEl.appendChild(s); return s; });
              gsap.set(line, { x: W / 2 - line.offsetWidth / 2, y: H / 2 - line.offsetHeight / 2 });
              var tl = gsap.timeline({ paused: true });
              [0.04, 0.35].forEach(function (t0) {
                tl.set(chars, { opacity: 0 }, t0);
                tl.fromTo(flip, { rotationY: 0, opacity: 1 }, { rotationY: 180, opacity: 0.45, duration: 0.12, ease: "power2.in", immediateRender: false }, t0);
                tl.to(flip, { rotationY: 360, opacity: 1, duration: 0.12, ease: "power2.out" }, t0 + 0.12);
                chars.forEach(function (c, i) { tl.set(c, { opacity: 1 }, t0 + 0.2 + i * 0.03); });
              });
              tl.set({}, {}, BASE);
              return tl;
            }

            var fonts = document.fonts ? document.fonts.ready : Promise.resolve();
            fonts.then(function () {
              var inner = build();
              var tl = gsap.timeline({ paused: true });
              tl.to(inner, { time: BASE, duration: length, ease: "none" }, 0);
              window.__timelines = window.__timelines || {};
              window.__timelines[ID] = tl;
            });
          })();
        </script>
      </div>
    </template>
  </body>
</html>
